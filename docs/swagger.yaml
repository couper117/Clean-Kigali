openapi: 3.0.3
info:
  title: Clean Kigali API
  version: 1.0.0
  description: >
    Residents of Kigali report sanitation problems (illegal dumping, full bins,
    blocked drains) and city staff follow each report until it is resolved.
servers:
  - url: /
    description: The server this page is served from
tags:
  - name: System
    description: Checks that the API is running
  - name: Auth
    description: Staff log in here. Click Authorize and paste the token to call staff routes.
  - name: Reports
    description: Sanitation problems reported by residents and followed by staff
paths:
  /api/health:
    get:
      tags: [System]
      summary: Check that the API and database are running
      responses:
        '200':
          description: API and database are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: API is up but cannot reach the database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: degraded
                environment: production
                database: down
                uptimeSeconds: 42
                timestamp: '2026-11-25T08:00:00.000Z'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in as a staff member and get a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in. Send the token as Authorization Bearer on staff routes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Email or password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 401
                  message: Email or password is incorrect
        '403':
          description: The account is deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 403
                  message: This account is deactivated; ask an admin to reactivate it
  /api/auth/me:
    get:
      tags: [Auth]
      summary: The staff member who owns the token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The logged-in user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/reports:
    post:
      tags: [Reports]
      summary: Report a sanitation problem (public) and get a reference code
      description: >
        No login needed. The report starts with status new and priority medium;
        staff change these later. Keep the reference code to follow the report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
      responses:
        '201':
          description: Report saved. The Location header points to it.
          headers:
            Location:
              schema:
                type: string
                example: /api/reports/12
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: Missing or invalid fields, or a category or sector that does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 400
                  message: Some fields are not valid
                  details:
                    - field: categoryId
                      message: categoryId is required
                    - field: sectorId
                      message: There is no sector with id 99
    get:
      tags: [Reports]
      summary: List reports with filters and pages (staff)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [new, in_progress, resolved, rejected]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high]
        - name: categoryId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: sectorId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: assignedTo
          in: query
          description: Id of the staff member the report is assigned to
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          description: Reported on or after this day (Kigali time)
          schema:
            type: string
            format: date
            example: '2026-11-01'
        - name: to
          in: query
          description: Reported on or before this day (Kigali time)
          schema:
            type: string
            format: date
            example: '2026-11-30'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of reports, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportList'
        '400':
          description: A filter has a wrong value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 400
                  message: Some fields are not valid
                  details:
                    - field: limit
                      message: limit must be from 1 to 100
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The token from POST /api/auth/login
  responses:
    BadRequest:
      description: Some fields are not valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 400
              message: Some fields are not valid
              details:
                - field: email
                  message: Enter a valid email address
    Unauthorized:
      description: No token, or the token is not valid or has expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 401
              message: 'Log in first, then send the header Authorization: Bearer <token>'
    Forbidden:
      description: Logged in, but this role may not do this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 403
              message: Only admin accounts can do this
    NotFound:
      description: No record with this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 404
              message: Report not found
  schemas:
    ReportInput:
      type: object
      required: [title, description, categoryId, sectorId]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
          example: Bin overflowing at Kimironko market
        description:
          type: string
          minLength: 10
          maxLength: 2000
          example: The big bin by the market entrance has not been emptied for four days.
        categoryId:
          type: integer
          example: 2
        sectorId:
          type: integer
          example: 1
        locationDetails:
          type: string
          maxLength: 255
          example: Next to the bus stop, KG 11 Ave
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Send together with longitude, or leave both out
          example: -1.9497
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: 30.1263
        reporterName:
          type: string
          maxLength: 100
          example: Aline Uwase
        reporterPhone:
          type: string
          description: Rwandan mobile number, so staff can call back
          example: '0788123456'
    Report:
      type: object
      properties:
        id:
          type: integer
          example: 12
        reference:
          type: string
          example: CK-7F3K2A
        title:
          type: string
        description:
          type: string
        category:
          type: object
          properties:
            id:
              type: integer
              example: 2
            name:
              type: string
              example: Overflowing bin
        sector:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Kimironko
            district:
              type: string
              example: Gasabo
        locationDetails:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
          example: -1.9497
        longitude:
          type: number
          nullable: true
          example: 30.1263
        status:
          type: string
          enum: [new, in_progress, resolved, rejected]
        priority:
          type: string
          enum: [low, medium, high]
        reporter:
          type: object
          properties:
            name:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
        assignedTo:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            fullName:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
    ReportList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Report'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 57
        totalPages:
          type: integer
          example: 3
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@cleankigali.rw
        password:
          type: string
          format: password
          maxLength: 72
          example: your-password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: string
          example: 8h
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      description: A staff account. The password hash is never returned.
      properties:
        id:
          type: integer
          example: 1
        fullName:
          type: string
          example: Jean Bosco Niyonzima
        email:
          type: string
          format: email
          example: admin@cleankigali.rw
        role:
          type: string
          enum: [admin, officer]
        sectorId:
          type: integer
          nullable: true
          example: null
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        environment:
          type: string
          example: development
        database:
          type: string
          enum: [up, down]
        uptimeSeconds:
          type: integer
          example: 42
        timestamp:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'Route not found: GET /api/nothing'
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
