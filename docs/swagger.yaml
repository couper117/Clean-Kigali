openapi: 3.0.3
info:
  title: Clean Kigali API
  version: 1.0.0
  description: >
    Residents of Kigali report sanitation problems (illegal dumping, full bins,
    blocked drains) and city staff follow each report until it is resolved.
servers:
  - url: /
    description: The server this page is served from
tags:
  - name: System
    description: Checks that the API is running
paths:
  /api/health:
    get:
      tags: [System]
      summary: Check that the API and database are running
      responses:
        '200':
          description: API and database are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: API is up but cannot reach the database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: degraded
                environment: production
                database: down
                uptimeSeconds: 42
                timestamp: '2026-11-25T08:00:00.000Z'
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        environment:
          type: string
          example: development
        database:
          type: string
          enum: [up, down]
        uptimeSeconds:
          type: integer
          example: 42
        timestamp:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'Route not found: GET /api/nothing'
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
