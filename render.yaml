# Render Blueprint: creates the production database and web service from this repository.
# Render dashboard > New > Blueprint > pick this repository. Secrets are never written here:
# DATABASE_URL is filled in by Render from the database it creates.
databases:
  - name: clean-kigali-db
    plan: free
    region: frankfurt
    databaseName: clean_kigali
    user: clean_kigali

services:
  - type: web
    name: clean-kigali-api
    runtime: node
    plan: free
    region: frankfurt          # closest Render region to Rwanda
    branch: main
    autoDeploy: true           # every merge into main deploys
    buildCommand: npm ci
    # Bring the schema up to date, then start. The runner is safe to run on every start:
    # applied migrations are skipped and a lock stops two copies migrating at once.
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: clean-kigali-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
